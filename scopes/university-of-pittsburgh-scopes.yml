detail: >-
  The University of Pittsburgh operates no OAuth 2.0 authorization server on a public surface and
  publishes no scope model. There is nothing to enumerate here, and this file exists to say so
  rather than to be filled.

  Each institution-operated surface uses an all-or-nothing credential instead of scopes. Project
  Tycho issues one API key per registered account, carried in the query string, granting the same
  read access to every path; the published reference names no scope, permission or role. The WPRDC
  CKAN Action API is anonymously readable with no credential and offers no public write path. The
  University Library System's OAI-PMH providers are anonymously harvestable, and OAI-PMH has no
  authorization model of its own. The OJS REST API alongside them is closed entirely — HTTP 403
  api.403.unauthorized to any unauthenticated caller — behind a per-user token issued inside each
  journal, not a scoped grant.

  Pitt Passport (https://passport.pitt.edu/idp/shibboleth) is a SAML 2.0 identity provider, and SAML
  attribute release is the nearest thing to a scope model the university publishes. It is not an
  OAuth scope model and it governs attributes released to relying service providers, not access to
  an API, so it is recorded in authentication/ rather than fabricated into a scope list here.
