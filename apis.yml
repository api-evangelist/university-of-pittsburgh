aid: university-of-pittsburgh
name: University of Pittsburgh
description: >-
  The University of Pittsburgh is a public research university in Pittsburgh, Pennsylvania, ranked
  #271 in the QS World University Rankings 2025. It operates no central developer portal, no API
  gateway and no institution-wide developer program — developer.pitt.edu and apis.pitt.edu do not
  resolve, and www.pitt.edu serves neither apis.json nor llms.txt. What it does operate is four
  unrelated machine-readable surfaces built by four different units that share no identifier, no
  envelope, no error model and no case convention: Project Tycho, a global epidemiological
  surveillance API at www.tycho.pitt.edu built in the Public Health Dynamics Laboratory; the
  Western Pennsylvania Regional Data Center, a CKAN 2.11.6 open data portal led by Pitt's UCSUR in
  partnership with Allegheny County and the City of Pittsburgh; the University Library System's
  E-Journal Publishing platform, a self-hosted PKP Open Journal Systems estate on ULS's own machines
  serving conformant OAI-PMH 2.0 across dozens of journals and 14,470 Crossref-registered DOIs; and
  Pitt Passport, the campus Shibboleth SAML 2.0 identity provider registered in InCommon and eduGAIN.
  None of the four publishes an OpenAPI, a changelog, a deprecation policy or a status page, and
  Project Tycho serves a rejected credential with HTTP 200 and an HTML sentence. Two further
  surfaces carrying Pitt's name are tenancies rather than Pitt's engineering: D-Scholarship@Pitt is
  now a Hyku Commons tenant (d-scholarship.pitt.edu CNAMEs to pittir.hykucommons.org), and PittAPI
  is an unofficial library written by a student club. This profile was rebuilt on 2026-08-30 under
  the university pipeline, which settles who operates a surface before saving anything about it.
