  generated: '2026-08-30'
  method: probed
  detail: >-
    Six surfaces were settled by live probe on 2026-08-30 before anything was saved: four
    institution-operated and two tenancies. Two of the four are first-time finds that the June 2026
    profile and the cohort host audit could not have seen — the University Library System's
    self-hosted OJS estate, whose OAI-PMH 2.0 providers answer on at least eleven separate pitt.edu
    journal hosts backed by 14,470 Crossref DOIs, and Pitt Passport, the campus Shibboleth SAML 2.0
    identity provider registered in InCommon. Two of the four surfaces the June profile did carry
    were re-graded: D-Scholarship@Pitt is not an institution-operated EPrints repository but a Hyku
    Commons tenant (d-scholarship.pitt.edu CNAMEs to pittir.hykucommons.org), and the /cgi/oai2 path
    recorded for it is the stale pre-migration one, still returning HTTP 403 behind Cloudflare while
    the live endpoint at /catalog/oai returns 200 with real records; and PittAPI is not one of Pitt's
    APIs but an unofficial Python library written by a student club against Pitt web pages. Project
    Tycho survives as a genuine institution-designed API and now carries a fourteen-path OpenAPI, a
    JSON Schema and a request example set derived from Pitt's own published reference. Five of the
    twelve education-regime domain standards are satisfied with evidence — oai-pmh, shibboleth, saml,
    datacite and crossref — four of them by institution-operated surfaces. What is genuinely absent is
    a program: no developer portal (developer.pitt.edu and apis.pitt.edu do not resolve), no gateway,
    no apis.json, no llms.txt, no OpenAPI published by Pitt for any surface, no changelog, no
    deprecation policy, and a status page at status.pitt.edu that covers none of these APIs. One
    verdict is contested and recorded as contested: the cohort audit run with --resolve grades Pitt
    Passport `tenant` because passport.pitt.edu CNAMEs to pitt.idaccessmanage.com, while every
    self-description in its SAML metadata is Pitt's; the disagreement and both bases are written into
    that surface's x-operator-caveat rather than resolved silently.
