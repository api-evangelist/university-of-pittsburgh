- aid: university-of-pittsburgh:pittapi
  name: PittAPI (Pitt Computer Science Club) — student-built
  description: >-
    PittAPI is an unofficial, community-maintained Python library published by the Pitt Computer
    Science Club that scrapes University of Pittsburgh web sources for courses, dining, library,
    news, laundry, computer labs, shuttle routes, the people directory and textbooks. It is a client
    library, not an API: there is no endpoint, no contract and no service behind it, and the data it
    reaches is served by Pitt web pages that were never designed to be called. It exists because
    Pitt's own campus-life data has no public API — psmobile.pitt.edu's class search returns HTTP 500
    behind Pitt Passport to an unauthenticated client. Recorded as `tenant` rather than
    `institution` per the pipeline's rule for student-built surfaces on a non-institution domain:
    the data is Pitt's, the software is not, and no pitt.edu endorsement of the library was found.
    The June 2026 profile recorded it as one of the university's four APIs.
