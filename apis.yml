    jmla.pitt.edu, cinej.pitt.edu and at least seven further journal hosts. ULS is not merely a
    consumer of this software: the ulsdevteam GitHub organization holds 299 public repositories,
    including OJS/PKP plugins ULS itself wrote. The OJS REST API alongside each provider is closed
    to the public (HTTP 403 api.403.unauthorized); the OAI-PMH surface is open. Discovered
