- aid: university-of-pittsburgh:wprdc-ckan
  name: Western Pennsylvania Regional Data Center (WPRDC) CKAN API
  description: >-
    WPRDC is a regional open data portal led by the University Center for Social and Urban Research
    (UCSUR) at the University of Pittsburgh, in partnership with Allegheny County and the City of
    Pittsburgh and funded by the Richard King Mellon Foundation. Its own Data Use Agreement names
    the University as the operating party. The portal runs CKAN 2.11.6 on infrastructure the project
    operates itself, with a local `wprdctheme` extension alongside datastore, spatialdata, dcat and
    datapusher_plus, and it exposes the CKAN Action API keyless for read plus a DCAT-US 1.1 catalog
    at /data.json and JSON-LD at /catalog.jsonld. Recorded as institution-operated because Pitt runs
    the deployment — but the API contract itself is CKAN's upstream design, not Pitt's engineering,
    so no generic CKAN OpenAPI is saved under this institution's name.
