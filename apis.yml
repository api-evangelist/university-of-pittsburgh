apis:
- aid: university-of-pittsburgh:project-tycho
  name: Project Tycho API
  description: >-
    Project Tycho is an open-access repository for global health surveillance data, built and run at
    the University of Pittsburgh and served from www.tycho.pitt.edu. It holds case counts for 78
    notifiable conditions in the United States, dengue for 100 countries and COVID-19 for 237
    countries, standardized into the Project Tycho Pre-compiled Data Format version 1.0. The API is
    fourteen GET endpoints returning CSV: thirteen listings that enumerate the controlled values of
    each variable in that format, and /query, which returns the surveillance rows filtered on any of
    them. Every call carries a free API key in the query string. The site is maintained for Project
    Tycho by the MIDAS Coordination Center under NIH/NIGMS grant R24GM153920 and is copyright
    University of Pittsburgh. Pitt publishes no machine-readable contract for it; the OpenAPI in
    this repository was written by API Evangelist from Pitt's own published reference.
