  versioning:
    scheme: OAI-PMH protocol version
    current: '2.0'
    in_url: false
    note: >-
      The one surface in this profile that carries a visible migration boundary. Its earliestDatestamp
      is 2026-01-26T21:08:39Z — not the age of the repository's content but the age of the current
      platform, because D-Scholarship moved from EPrints to Hyku Commons this year. A harvester with
