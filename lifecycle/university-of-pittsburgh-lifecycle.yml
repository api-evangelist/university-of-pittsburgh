- aid: university-of-pittsburgh:wprdc-ckan
  operator: institution
  versioning:
    scheme: CKAN Action API major version in the path
    current: '3'
    in_url: true
    note: >-
      /api/3/action/* is CKAN's own versioning convention, not the University of Pittsburgh's. The
      running software is CKAN 2.11.6, reported by /api/3/action/status_show, with the local
      extension `wprdctheme` alongside eleven standard CKAN extensions — evidence of a locally
      operated and locally customised deployment rather than a hosted tenancy.
  changelog: none
