      GitHub/PyPI, and an official GitHub organization plus the library system
      dev org. The D-Scholarship institutional repository OAI-PMH endpoint
      returned 403 to an automated probe (bot protection, endpoint likely
      live). No endpoints were fabricated; all baseURLs come from confirmed
      documentation or live responses.
